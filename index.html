<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>魔丸能量盲盒 · 积极心理暗示</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#ffd66b;
  --pink:#ff8fab;
  --purple:#b06bff;
  --cyan:#7ee8fa;
}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  background:radial-gradient(circle at 50% 0%, #2b1250 0%, #150726 45%, #08030f 100%);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:26px 16px 46px;
  position:relative;
}

#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;animation:twinkle 3s infinite ease-in-out;
}
@keyframes twinkle{
  0%,100%{opacity:.12;transform:scale(.6);}
  50%{opacity:.9;transform:scale(1.3);}
}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.38;}
.orb.a{width:340px;height:340px;background:#7c3aed;top:-130px;left:-130px;animation:drift1 18s ease-in-out infinite;}
.orb.b{width:300px;height:300px;background:#ff5c8a;bottom:-110px;right:-110px;animation:drift2 22s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(70px,60px);}}
@keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-80px,-50px);}}

.app{
  position:relative;z-index:1;
  width:100%;max-width:640px;
  display:flex;flex-direction:column;align-items:center;
}

header{text-align:center;margin-bottom:6px;}
h1{
  font-size:clamp(25px,6.4vw,36px);
  letter-spacing:3px;
  font-weight:800;
  background:linear-gradient(90deg,#ffd66b,#ff8fab,#b06bff,#7ee8fa,#ffd66b);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:flow 7s linear infinite;
  filter:drop-shadow(0 4px 22px rgba(176,107,255,.5));
}
@keyframes flow{to{background-position:300% 0;}}
.sub{
  margin-top:10px;
  font-size:13px;
  letter-spacing:1.5px;
  color:rgba(255,255,255,.55);
}

.stage{
  position:relative;
  width:100%;
  min-height:500px;
  display:grid;
  place-items:center;
  margin-top:6px;
}
.stage > .gift,
.stage > .card{grid-area:1/1;place-self:center;}

.gift{
  position:relative;
  width:180px;height:176px;
  cursor:pointer;
  z-index:1;
  transition:opacity .5s ease, transform .5s cubic-bezier(.3,1.4,.5,1);
  filter:drop-shadow(0 0 28px rgba(176,107,255,.55));
  -webkit-tap-highlight-color:transparent;
}
.gift::before{
  content:'';
  position:absolute;inset:-46px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(176,107,255,.55) 0%,rgba(255,143,171,.22) 40%,transparent 68%);
  animation:pulse 2.8s ease-in-out infinite;
  z-index:0;
}
@keyframes pulse{
  0%,100%{transform:scale(.9);opacity:.5;}
  50%{transform:scale(1.15);opacity:.95;}
}
.gift.hide{opacity:0;transform:scale(.35) rotate(18deg);pointer-events:none;}

.gift .lid{
  position:absolute;top:0;left:-12px;width:204px;height:54px;
  border-radius:16px;
  background:linear-gradient(160deg,#fff4c9,#ffcf5c 42%,#ff9a3c);
  box-shadow:0 10px 28px rgba(255,160,60,.5),inset 0 -8px 16px rgba(190,90,0,.25);
  z-index:3;
}
.gift .lid::before{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  top:0;width:36px;height:100%;border-radius:4px;
  background:linear-gradient(180deg,#ffb1c6,#e0447a);
}
.gift .lid::after{
  content:'';position:absolute;left:50%;top:-28px;transform:translateX(-50%);
  width:58px;height:32px;
  background:
    radial-gradient(circle at 24% 50%, #ff8fab 0 38%, transparent 39%),
    radial-gradient(circle at 76% 50%, #ff8fab 0 38%, transparent 39%);
  filter:drop-shadow(0 4px 10px rgba(224,68,122,.55));
}

.gift .body{
  position:absolute;top:46px;left:0;
  width:180px;height:130px;
  border-radius:6px 6px 22px 22px;
  background:linear-gradient(160deg,#a855f7,#7c3aed 45%,#4c1d95);
  box-shadow:inset 0 -18px 30px rgba(0,0,0,.38),0 24px 50px rgba(124,58,237,.5);
  overflow:hidden;
  z-index:2;
}
.gift .body::before{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  width:36px;height:100%;
  background:linear-gradient(180deg,#ffcf5c,#ff9a3c);
  opacity:.92;
}
.gift .body::after{
  content:'';position:absolute;top:-50%;left:-40%;
  width:55%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:rotate(22deg);
  animation:sweep 3.6s ease-in-out infinite;
}
@keyframes sweep{0%{left:-45%;}55%,100%{left:135%;}}

.gift.shake{animation:shakeBox .46s ease-in-out 2;}
@keyframes shakeBox{
  0%,100%{transform:translateY(0) rotate(0) scale(1);}
  20%{transform:translateY(-14px) rotate(-5deg) scale(1.04);}
  42%{transform:translateY(0) rotate(5deg) scale(.98);}
  64%{transform:translateY(-10px) rotate(-4deg) scale(1.05);}
  84%{transform:translateY(0) rotate(3deg) scale(1);}
}

.card{
  width:min(88vw,420px);
  min-height:290px;
  padding:40px 32px;
  border-radius:30px;
  background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 70px rgba(176,107,255,.38),inset 0 1px 0 rgba(255,255,255,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  text-align:center;
  z-index:4;
  opacity:0;
  transform:scale(.4) rotate(-10deg);
  transition:opacity .5s ease,transform .65s cubic-bezier(.2,1.35,.4,1);
  pointer-events:none;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.card.show{opacity:1;transform:scale(1) rotate(0);pointer-events:auto;}
.card.hide{opacity:0;transform:scale(.6) rotate(8deg);}
.card:active{transform:scale(.98);}

.card-tag{
  font-size:12px;letter-spacing:3px;
  color:rgba(255,214,107,.85);
  text-transform:uppercase;
}
.card-text{
  font-size:clamp(19px,5vw,25px);
  line-height:1.75;
  font-weight:700;
  letter-spacing:.8px;
  background:linear-gradient(120deg,#fff8dc,#ffd66b 38%,#ffb3d1 72%,#c9b0ff);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:flow 9s linear infinite;
  text-shadow:0 0 40px rgba(255,214,107,.18);
}
.card-hint{
  font-size:12px;
  letter-spacing:1px;
  color:rgba(255,255,255,.42);
}
.card-copy-badge{
  position:absolute;
  top:14px;right:16px;
  font-size:11px;
  color:rgba(255,255,255,.5);
  letter-spacing:1px;
  background:rgba(255,255,255,.08);
  padding:4px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
}

.controls{
  display:flex;gap:14px;margin-top:26px;
  flex-wrap:wrap;justify-content:center;
}
button{
  font-family:inherit;font-size:15.5px;font-weight:700;
  padding:14px 34px;
  border-radius:999px;
  border:none;cursor:pointer;
  color:#2a0f45;
  background:linear-gradient(135deg,#fff0b8,#ffd66b 38%,#ff9a3c);
  box-shadow:0 12px 32px rgba(255,180,80,.42);
  transition:transform .18s ease,box-shadow .18s ease,opacity .25s,background .25s;
  letter-spacing:1px;
  -webkit-tap-highlight-color:transparent;
}
button:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(255,180,80,.55);}
button:active{transform:translateY(0) scale(.97);}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
button.ghost{
  background:rgba(255,255,255,.09);
  color:#fff;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:none;
}
button.ghost:hover{background:rgba(255,255,255,.18);box-shadow:0 12px 28px rgba(255,255,255,.1);}
button.fav-on{
  background:linear-gradient(135deg,#ff9dbb,#ff5c8a);
  color:#fff;border-color:transparent;
  box-shadow:0 12px 30px rgba(255,92,138,.45);
}
button.share-btn{
  background:linear-gradient(135deg,#7ee8fa,#b06bff);
  color:#fff;
  box-shadow:0 12px 32px rgba(176,107,255,.45);
}

.stats{
  display:flex;gap:24px;margin-top:24px;flex-wrap:wrap;justify-content:center;
  font-size:12.5px;color:rgba(255,255,255,.5);letter-spacing:.5px;
}
.stats span{display:inline-flex;align-items:center;gap:6px;}
.stats b{color:var(--gold);font-size:15px;font-weight:800;}
.stats .clickable{cursor:pointer;transition:color .2s;}
.stats .clickable:hover{color:rgba(255,255,255,.9);}

.particle{
  position:absolute;left:50%;top:50%;
  width:9px;height:9px;border-radius:50%;
  margin:-4.5px 0 0 -4.5px;
  pointer-events:none;z-index:6;
  animation:fly var(--d) cubic-bezier(.15,.7,.3,1) forwards;
}
@keyframes fly{
  0%{transform:translate(0,0) scale(var(--s));opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}
}

.modal{
  position:fixed;inset:0;z-index:50;
  background:rgba(8,3,15,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.modal.show{opacity:1;pointer-events:auto;}
.modal-card{
  width:min(560px,100%);max-height:72vh;
  background:linear-gradient(160deg,rgba(62,32,104,.96),rgba(28,11,52,.99));
  border:1px solid rgba(255,255,255,.18);
  border-radius:26px;padding:22px;
  display:flex;flex-direction:column;gap:16px;
  transform:translateY(24px) scale(.96);
  transition:transform .32s cubic-bezier(.2,1.2,.4,1);
  box-shadow:0 30px 90px rgba(0,0,0,.65);
}
.modal.show .modal-card{transform:translateY(0) scale(1);}
.modal-head{display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16.5px;color:var(--gold);letter-spacing:2px;font-weight:700;}
.icon-btn{
  width:34px;height:34px;padding:0;border-radius:50%;
  background:rgba(255,255,255,.1);color:#fff;
  border:none;font-size:14px;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:none;
}
.icon-btn:hover{background:rgba(255,255,255,.2);transform:none;box-shadow:none;}
.modal-body{
  overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
  padding-right:6px;
}
.modal-body::-webkit-scrollbar{width:6px;}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px;}
.fav-item{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:12px 16px;
  font-size:14px;line-height:1.65;
  color:rgba(255,255,255,.9);
}
.fav-empty{
  color:rgba(255,255,255,.45);
  font-size:14px;text-align:center;
  padding:34px 0;letter-spacing:1px;
}

/* 分享卡片模态框 */
.share-modal-card{max-height:88vh;}
.share-preview{
  display:flex;justify-content:center;
  padding:6px 0;
}
.share-preview img{
  width:100%;
  max-width:340px;
  border-radius:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  display:block;
}
.share-hint{
  text-align:center;
  font-size:12.5px;
  color:rgba(255,255,255,.55);
  letter-spacing:1px;
}
.share-actions{
  display:flex;gap:12px;justify-content:center;
}
.share-actions button{
  padding:11px 26px;
  font-size:14px;
}

/* Toast */
.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,8,40,.92);
  color:#fff;
  padding:12px 26px;
  border-radius:999px;
  font-size:14px;
  letter-spacing:1px;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  opacity:0;
  pointer-events:none;
  transition:all .3s cubic-bezier(.2,1.2,.4,1);
  z-index:200;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  white-space:nowrap;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media (max-width:420px){
  .stage{min-height:440px;}
  .card{padding:32px 22px;border-radius:24px;}
  .gift{width:158px;height:158px;}
  .gift .lid{width:182px;left:-12px;height:48px;}
  .gift .body{width:158px;top:42px;height:116px;}
  .controls button{padding:13px 26px;font-size:14.5px;}
  .share-preview img{max-width:280px;}
}
</style>
</head>

</div>

<div class="toast" id="toast"></div>

/* 生成完整标语池 */
const POOL = [];
PREFIXES.forEach(p => CORES.forEach(c => POOL.push(p + c)));

/* =========================================================
   二、洗牌抽签
   ========================================================= */
let order = [];
let cursor = 0;

function reshuffle(){
  order = POOL.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  cursor = 0;
}
reshuffle();

function nextPhrase(){
  if (cursor >= order.length) reshuffle();
  return POOL[order[cursor++]];
}

/* =========================================================
   四、Web Audio 音效引擎
   ========================================================= */
let audioCtx = null;

function initAudio(){
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

/* 开启音效：上升扫频 */
function playOpenSound(){
  const ctx = initAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  const t = ctx.currentTime;
  osc.frequency.setValueAtTime(220, t);
  osc.frequency.exponentialRampToValueAtTime(1400, t + 0.55);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.28, t + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.7);
}

/* 爆裂音效：滤波白噪声 */
function playBurstSound(){
  const ctx = initAudio();
  if (!ctx) return;
  const duration = 0.35;
  const bufferSize = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.2);
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 900;
  const gain = ctx.createGain();
  const t = ctx.currentTime;
  gain.gain.setValueAtTime(0.35, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  source.start(t);
}

/* 复制音效：轻快的叮 */
function playCopySound(){
  const ctx = initAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  const t = ctx.currentTime;
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(1760, t + 0.12);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.2);
}

function startShake(){

  setTimeout(() => {
    giftEl.classList.remove('shake');
    giftEl.classList.add('hide');
    burst();
    playBurstSound();

    const phrase = nextPhrase();
    cardTextEl.textContent = phrase;
    currentText = phrase;

    setTimeout(() => {
      cardEl.classList.add('show');

      drawing = false;
      drawBtn.disabled = false;
      favBtn.disabled = false;
      shareBtn.disabled = false;
      drawBtn.textContent = '再抽一次';

      syncFavBtn();
      updateStats();

/* =========================================================
   七、粒子爆炸
   ========================================================= */
const PARTICLE_COLORS = ['#ffd66b', '#ff8fab', '#b06bff', '#7ee8fa', '#fff6d5'];

function burst(){
  const total = 34;
  for (let i = 0; i < total; i++){
    const p = document.createElement('div');
    p.className = 'particle';

    const angle = (Math.PI * 2 * i) / total + Math.random() * 0.35;
    const dist  = 80 + Math.random() * 210;

    p.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
    p.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
    p.style.setProperty('--d', (0.7 + Math.random() * 0.8).toFixed(2) + 's');
    p.style.setProperty('--s', (0.5 + Math.random() * 1.1).toFixed(2));

    const c = PARTICLE_COLORS[i % PARTICLE_COLORS.length];
    p.style.background = c;
    p.style.boxShadow = '0 0 14px ' + c;

    stageEl.appendChild(p);
    setTimeout(() => p.remove(), 1800);
  }
}

/* =========================================================
   八、点击卡片复制到剪贴板
   ========================================================= */
async function copyToClipboard(text){
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    // 兼容降级方案
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.top = '-9999px';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(textarea);
    return ok;
  } catch (e) {
    return false;
  }
}

cardEl.addEventListener('click', async () => {
  if (!currentText) return;
  initAudio();
  const ok = await copyToClipboard(currentText);
  if (ok) {

  } else {
    showToast('复制失败，请手动选择文字');
  }
});

/* =========================================================
   九、分享卡片生成
   ========================================================= */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  const lines = [];
  let line = '';
  for (let i = 0; i < text.length; i++){
    const test = line + text[i];
    if (ctx.measureText(test).width > maxWidth && line.length > 0){
      lines.push(line);
      line = text[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function generateShareCard(text){
  return new Promise((resolve) => {
    const W = 750, H = 1000;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // 背景渐变
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#2b1250');
    bg.addColorStop(0.5, '#150726');
    bg.addColorStop(1, '#08030f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 星空
    for (let i = 0; i < 150; i++){
      ctx.beginPath();
      const r = Math.random() * 1.6 + 0.4;
      ctx.arc(Math.random() * W, Math.random() * H, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.5 + 0.15) + ')';
      ctx.fill();
    }

    // 光晕
    const glow = ctx.createRadialGradient(W/2, 320, 60, W/2, 320, 420);
    glow.addColorStop(0, 'rgba(176,107,255,0.45)');
    glow.addColorStop(1, 'rgba(176,107,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // 顶部品牌标题
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 36px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#ffd66b';
    ctx.fillText('✦ 魔丸能量盲盒 ✦', W/2, 100);

    // 副标题
    ctx.font = '22px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('今日能量启示', W/2, 155);

    // 卡片区域
    const cardX = 60, cardY = 230, cardW = W - 120, cardH = 440;
    roundRect(ctx, cardX, cardY, cardW, cardH, 32);
    const cardBg = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH);
    cardBg.addColorStop(0, 'rgba(255,255,255,0.16)');
    cardBg.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = cardBg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 卡片内标语
    ctx.font = 'bold 38px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#fff8dc';
    const lines = wrapText(ctx, text, cardW - 80);
    const lineHeight = 62;
    const totalHeight = lines.length * lineHeight;
    const startY = cardY + (cardH - totalHeight) / 2 + lineHeight * 0.55;
    lines.forEach((line, i) => {
      ctx.fillText(line, W/2, startY + i * lineHeight);
    });

    // 引导文字
    ctx.font = 'bold 26px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,214,107,0.95)';
    ctx.fillText('扫码开启你的能量盲盒', W/2, 730);

    // 二维码
    const qrSize = 150;
    const qrX = W/2 - qrSize/2;
    const qrY = 770;

    try {
      if (typeof qrcode === 'function'){
        const qr = qrcode(0, 'M');
        qr.addData(SITE_URL);
        qr.make();
        const count = qr.getModuleCount();
        const cell = qrSize / count;
        // 白底
        ctx.fillStyle = '#ffffff';
        roundRect(ctx, qrX - 10, qrY - 10, qrSize + 20, qrSize + 20, 12);
        ctx.fill();
        // 模块
        ctx.fillStyle = '#150726';
        for (let row = 0; row < count; row++){
          for (let col = 0; col < count; col++){
            if (qr.isDark(row, col)){
              ctx.fillRect(qrX + col * cell, qrY + row * cell, cell + 0.5, cell + 0.5);
            }
          }
        }
      } else {
        // 库未加载时，画一个占位框
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        roundRect(ctx, qrX - 10, qrY - 10, qrSize + 20, qrSize + 20, 12);
        ctx.fill();
        ctx.fillStyle = '#150726';
        ctx.font = 'bold 18px "PingFang SC", sans-serif';
        ctx.fillText('二维码', W/2, qrY + qrSize/2);
      }
    } catch (e){
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      roundRect(ctx, qrX - 10, qrY - 10, qrSize + 20, qrSize + 20, 12);
      ctx.fill();
      ctx.fillStyle = '#150726';
      ctx.font = 'bold 18px "PingFang SC", sans-serif';
      ctx.fillText('二维码', W/2, qrY + qrSize/2);
    }

    // 底部网址
    ctx.font = '20px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(SITE_URL, W/2, 960);

    resolve(canvas);
  });
}

    favBtn.classList.add('fav-on');
    favBtn.textContent = '❤ 已收藏';

    favBtn.classList.remove('fav-on');

  initAudio();
  const i = favorites.indexOf(currentText);
  if (i >= 0) favorites.splice(i, 1);
  else favorites.push(currentText);

  try {
    localStorage.setItem('mowan_fav', JSON.stringify(favorites));
  } catch (e) {}

  syncFavBtn();
  updateStats();
});

/* =========================================================
   十一、统计 & 收藏弹窗
   ========================================================= */
function updateStats(){
  document.getElementById('statDraw').textContent = drawCount;
  document.getElementById('statPool').textContent = POOL.length;
  document.getElementById('statFav').textContent  = favorites.length;
}

function renderFavList(){
  if (favorites.length === 0){
    favListEl.innerHTML = '<div class="fav-empty">还没有收藏哦，去开启一个盲盒吧 ✦</div>';
    return;
  }
  favListEl.innerHTML = favorites
    .slice()
    .reverse()
    .map(t => '<div class="fav-item">' + escapeHTML(t) + '</div>')
    .join('');
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

document.getElementById('openFav').addEventListener('click', () => {
  renderFavList();
  modalEl.classList.add('show');
});

  }

})();
